<style>

.th{position:relative}.th img{width:80px;height:80px;object-fit:cover;border-radius:8px;display:block}.th b{position:absolute;top:-5px;right:-5px;background:#b42318;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:12px;cursor:pointer;line-height:18px}

.btn{min-height:44px;padding:10px 14px}.bar .btn{flex:1 1 auto}input,select,textarea{padding:11px}
header{padding:10px 12px}header>div:last-child{flex:1 1 100%!important}aside{scrollbar-width:none}aside button{padding:11px 14px}
th,td{padding:8px 6px}td input,td select{min-width:104px}.big{font-size:24px}
.sh{padding:16px}.sb{padding:14px}.ft{padding:12px 14px}.bn{font-size:24px}.tt{font-size:19px}.xr{flex-wrap:wrap}.xi{width:100%}.xi img,.ph{height:120px}.xs{width:100%}.xs .pl{flex:1}.sr{grid-template-columns:58px 1fr 1fr}}
@media print{aside,header,.np{display:none!important}.app{display:block}body{background:#fff}main{padding:0;max-width:none}.sheet{box-shadow:none;border-radius:0}.xr,.al{break-inside:avoid}.sht{break-after:avoid}.pvw{background:none;padding:0}#pvz{zoom:1!important}.sheet{width:100%;min-height:0!important}}

@page{size:A4;margin:8mm 0}</style></head><body>
<div class="app"><aside id="nav"></aside><div class="mn"><header><div class="lg"><img src="logo.png" alt="" onerror="this.style.display='none'">MIB <span>Fit</span></div><span id="cs" class="mu"></span><div id="hb" style="flex:0 1 320px;position:relative"><input id="hq" placeholder="🔍 Buscar aluno por nome ou código" autocomplete="off" oninput="sq(this.value,'hr')" onfocus="this.select()"><div class="sres" id="hr"></div></div></header><main id="m"></main></div></div>
<script>
const G=['Peito','Costas','Ombros','Bíceps','Tríceps','Quadríceps','Posterior','Glúteos','Abdômen','Panturrilha'];
const PN=['Cervical','Ombro','Cotovelo','Punho/mão','Coluna torácica','Lombar','Quadril','Joelho','Tornozelo/pé'];
const MET=[['Série simples','Uma série por vez, com descanso completo entre elas. Base para iniciantes e para aprender o movimento.'],['Séries múltiplas','Várias séries do mesmo exercício (ex.: 3 a 4 x 8-12). Método mais usado para hipertrofia e força.'],['Pirâmide crescente','Carga aumenta e repetições diminuem a cada série. Aquece progressivamente até a carga máxima.'],['Pirâmide decrescente','Começa com a carga mais alta e reduz nas séries seguintes, com mais repetições.'],['Bi-set','Dois exercícios seguidos, sem descanso, do mesmo músculo ou de músculos antagonistas.'],['Tri-set','Três exercícios seguidos para o mesmo grupo muscular, sem descanso.'],['Drop-set','Ao atingir a falha, reduz a carga e continua imediatamente. Alta intensidade, usar com moderação.'],['Rest-pause','Série até a falha, pausa curta (10-20 s) e novas repetições com a mesma carga.'],['Circuito','Sequência de exercícios para vários grupos, com pouco descanso. Foco em condicionamento.']];
const ZON=[['Força máxima','1 a 6 reps','2-5 min'],['Hipertrofia','6 a 12 reps','60-120 s'],['Resistência muscular','15+ reps','30-60 s']];
const T=[['aluno','Alunos'],['avaliacao','Avaliação física'],['treino','Treino'],['volume','Volume'],['previa','PDF do treino'],['salvos','Treinos salvos'],['hist','Histórico'],['ag','Agenda'],['prof','Professores'],['lib','Biblioteca'],['metodo','Metodologia']];const TA=[['meu','Meu treino'],['ag','Agendamento'],['hist','Histórico']];
let S;try{S=JSON.parse(localStorage.getItem('mibfit')||'null')}catch(e){}
S=S||{students:[],plans:[],lib:[],sid:'',tab:'aluno',model:'simples',q:'',d:{pid:'',name:'',obs:'',days:[]}};
S.checkins=S.checkins||[];S.ci=S.ci||{};S.sq=S.sq||'';S.ag=S.ag||[];S.profs=S.profs||[];let A={};try{A=JSON.parse(sessionStorage.getItem('mibA')||'{}')}catch(e){}
const saveLocal=()=>{try{if(A.role=='aluno')localStorage.setItem('mibci',JSON.stringify(S.ci));else localStorage.setItem('mibfit',JSON.stringify(S))}catch(e){if(!S.cl2)alert('Armazenamento cheio: use imagens menores.')}};
const save=()=>{saveLocal();if(cloud.on&&A.role=='prof')sched()};
if(A.role=='aluno'){S.students=[];S.plans=[];S.checkins=[];S.ag=[];S.profs=[];S.lib=[];try{S.ci=JSON.parse(localStorage.getItem('mibci')||'{}')}catch(e){S.ci={}}}
/* NUVEM: tudo (alunos, exercícios, professores, treinos, check-ins e agenda) fica no banco de dados */
const cloud={on:false,snap:{}};let tm,loadA=false;
const COLS=[['a','alunos','students'],['e','exercicios','lib'],['f','professores','profs'],['t','treinos','plans'],['c','checkins','checkins'],['g','agenda','ag']];
const cst=t=>{const e=document.getElementById('cs');if(e)e.textContent=t};
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sessionStorage.getItem('mibT')||'')}});let j={};try{j=await r.json()}catch(e){}
 if(r.status==401&&p!='login'){setA({});alert('Sessão expirada. Entre novamente.');throw new Error('Sessão expirada')}
 if(!r.ok)throw new Error(j.erro||'Erro '+r.status);return j}
const snapOf=()=>{const o={};COLS.forEach(([k,,sk])=>{o[k]={};S[sk].forEach(x=>o[k][x.id]=JSON.stringify(x))});return o};
function newCode(){const used=new Set(S.students.map(a=>a.codigo));for(let i=0;i<500;i++){const c=String(10000+crypto.getRandomValues(new Uint32Array(1))[0]%90000);if(!used.has(c)&&!/^(\d)\1{4}$/.test(c)&&!'01234567890'.includes(c)&&!'98765432109'.includes(c))return c}return String(10000+Math.floor(Math.random()*90000))}
function ensureCodes(){S.students.forEach(a=>{delete a.cpf;if(!/^\d{5}$/.test(a.codigo||''))a.codigo=newCode()})}
const sched=()=>{clearTimeout(tm);cst('☁ salvando…');tm=setTimeout(push,800)};
async function pull(){cst('☁ sincronizando…');
 try{const rs=await Promise.all(COLS.map(([,n])=>api('dados?t='+n))),first=!S.cl2,sn={};
  COLS.forEach(([k,n,sk],i)=>{const sv=rs[i][n]||[];sn[k]={};sv.forEach(x=>sn[k][x.id]=JSON.stringify(x));const m=new Set(sv.map(x=>x.id));S[sk]=first?sv.concat(S[sk].filter(x=>!m.has(x.id))):sv});
  ensureCodes();if(!S.students.some(x=>x.id==S.sid))S.sid='';
  S.cl2=1;cloud.snap=sn;cloud.on=true;saveLocal();R();await push()}
 catch(x){cloud.on=false;cst('⚠ sem conexão com o banco: '+x.message);if(x.message!='Sessão expirada')alert('Não foi possível carregar os dados do banco: '+x.message+'\n\nAs alterações NÃO serão salvas na nuvem até isso ser resolvido.')}}
async function push(){const cur=snapOf(),B=[],nb=()=>{const o={};COLS.forEach(([,n])=>o[n]={up:[],del:[]});return o};let b=nb(),z=0,any=false,ch=false;
 const add=(n,x)=>{const m=JSON.stringify(x).length;if(z+m>3e6){B.push(b);b=nb();z=0}b[n].up.push(x);z+=m;any=true};
 COLS.forEach(([k,n,sk])=>{S[sk].forEach(x=>{if(cloud.snap[k][x.id]!==cur[k][x.id])add(n,x)});for(const id in cloud.snap[k])if(!(id in cur[k])){b[n].del.push(id);any=true}});
 if(!any){cst('☁ sincronizado · '+S.students.length+' alunos · '+S.lib.length+' exercícios · '+S.plans.length+' treinos');return true}
 B.push(b);
 try{for(const x of B){const r=await api('dados',{method:'POST',body:JSON.stringify(x)});for(const id in (r.codes||{})){const a=S.students.find(q=>q.id==id);if(a&&a.codigo!==r.codes[id]){a.codigo=r.codes[id];cur.a[id]=JSON.stringify(a);ch=true}}}
  cloud.snap=cur;if(ch){saveLocal();R()}cst('☁ salvo na nuvem');return true}
 catch(e){cst('⚠ não salvou: '+e.message);return false}}
async function pullAluno(){const r=await api('aluno');S.students=[r.aluno];S.plans=r.plans;S.checkins=r.checkins;S.ag=r.ag;S.profs=r.profs;S.lib=[];S.sid=r.aluno.id}
async function refresh(){try{if(A.role=='aluno'){await pullAluno();R()}else{clearTimeout(tm);if(!(await push())&&!confirm('Há alterações que não foram salvas. Descartá-las e recarregar do banco?'))return;await pull()}}catch(e){alert(e.message)}}
const auto=t=>{if(['hist','ag'].includes(t))refresh()};
const uid=()=>Math.random().toString(36).slice(2,9),$=id=>document.getElementById(id),v=id=>$(id).value;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=()=>S.students.find(s=>s.id===S.sid),D=()=>S.d,allEx=()=>D().days.flatMap(d=>d.ex.map(e=>({...e,day:d.n})));
const today=()=>new Date().toLocaleDateString('en-CA'),fd=d=>String(d).split('-').reverse().join('/');
function setA(a){A=a;if(a.role)sessionStorage.setItem('mibA',JSON.stringify(a));else{sessionStorage.removeItem('mibA');sessionStorage.removeItem('mibT');cloud.on=false}R()}
const h256=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(),dg=s=>String(s||'').replace(/\D/g,'');
function vLogin(){const f=!S.pw;return `<div class="row" style="max-width:780px;margin:30px auto"><div class="card"><h3>Professor</h3><label>Senha do professor</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')plogin()"><div class="mt"><button class="btn" onclick="plogin()">Entrar</button></div></div><div class="card"><h3>Aluno</h3><label>Código do aluno</label><input id="la" inputmode="numeric" maxlength="5" placeholder="Digite seu código de 5 dígitos" onkeydown="if(event.key=='Enter')alogin()"><div class="mt"><button class="btn o" onclick="alogin()">Entrar</button></div><p class="mu" id="le"></p></div></div>`}
async function plogin(){const p=v('lp');if(!p)return;try{const r=await api('login',{method:'POST',body:JSON.stringify({senha:p})});sessionStorage.setItem('mibT',r.token);S.tab='aluno';setA({role:'prof'});pull()}catch(e){alert(e.message)}}
async function alogin(){const q=dg(v('la'));if(q.length!==5)return $('le').textContent='Digite os 5 dígitos do seu código.';
 try{const r=await api('aluno-login',{method:'POST',body:JSON.stringify({codigo:q})}),d=r.data;sessionStorage.setItem('mibT',r.token);
  S.students=[d.aluno];S.plans=d.plans;S.checkins=d.checkins;S.ag=d.ag;S.profs=d.profs;S.lib=[];S.sid=d.aluno.id;S.ci={};try{S.ci=JSON.parse(localStorage.getItem('mibci')||'{}')}catch(e){}
  S.tab='meu';setA({role:'aluno',sid:d.aluno.id})}catch(e){$('le').textContent=e.message}}
function R(){if(A.role=='aluno'&&loadA){$('nav').innerHTML='';$('m').innerHTML='<div class="card">Carregando seu treino…</div>';return}
 if(A.role=='aluno'&&!S.students.some(x=>x.id==A.sid)){A={};sessionStorage.removeItem('mibA');sessionStorage.removeItem('mibT')}
 const al=A.role=='aluno',tb=al?TA:T,sp=$('hb');
 if(!A.role){$('nav').innerHTML='';sp.style.display='none';$('m').innerHTML=vLogin();return}
 if(al)S.sid=A.sid;if(!tb.some(t=>t[0]==S.tab))S.tab=tb[0][0];
 $('nav').innerHTML=tb.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';save();R();scrollTo(0,0);auto('${t[0]}')">${t[1]}</button>`).join('')+'<button onclick="refresh()" style="margin-top:12px;color:#f3d77a">↻ Atualizar</button><button onclick="setA({})" style="color:#f3d77a">⎋ Sair</button>';
 sp.style.display=al?'none':'';
 $('hq').value=st()?st().name:'';

function savePlan(){const d=D();if(!d.days.length){alert('Adicione ao menos uma sessão.');return}if(!st()){alert('Selecione um aluno.');return}
 const c=JSON.parse(JSON.stringify(d));c.name=c.name||'Treino '+today();
 const p=S.plans.find(x=>x.id==c.pid);if(p){Object.assign(p,{name:c.name,obs:c.obs,days:c.days,date:today()});save();alert('Treino atualizado.');return}
 const n={id:uid(),sid:S.sid,name:c.name,obs:c.obs,days:c.days,date:today()};S.plans.push(n);D().pid=n.id;save();alert('Treino salvo.')}
function vSalvos(){const L=S.plans.filter(p=>!S.sid||p.sid==S.sid);return `<div class="card"><h3>Treinos salvos</h3><button class="btn g" onclick="S.d={pid:'',name:'',obs:'',days:[]};S.tab='treino';save();R()">Novo treino (limpar tela)</button>${L.map(p=>{const a=S.students.find(x=>x.id==p.sid);return `<div class="ex"><div class="bd"><b>${esc(p.name)}</b><div class="mu">${esc(a?a.name:'')} · ${esc(p.date)} · ${p.days.length} sessões</div></div><button class="btn g" onclick="loadPlan('${p.id}')">Carregar</button><button class="btn d" onclick="delPlan('${p.id}')">Excluir</button></div>`}).join('')||'<p class="mu">Nenhum treino salvo.</p>'}</div>`}
function loadPlan(i){const p=S.plans.find(x=>x.id==i);S.sid=p.sid;S.d=JSON.parse(JSON.stringify({pid:p.id,name:p.name,obs:p.obs,days:p.days}));S.tab='treino';save();R()}
function delPlan(i){if(confirm('Excluir treino salvo?')){S.plans=S.plans.filter(p=>p.id!=i);if(D().pid==i)D().pid='';save();R()}}
if(A.role=='aluno')loadA=true;R();if(A.role=='prof'&&sessionStorage.getItem('mibT'))pull();if(A.role=='aluno')pullAluno().then(()=>{loadA=false;R()},()=>{loadA=false;setA({})});
</script></body></html>
